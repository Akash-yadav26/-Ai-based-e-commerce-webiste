apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stitchlyn-ingress
  namespace: stitchlyn
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.stitchlyn.com
      secretName: stitchlyn-tls
  rules:
    - host: api.stitchlyn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5001

